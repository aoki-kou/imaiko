projects:
  - name: imaiko
    environments:
      - name: Production
        services:
          - name: imaiko-backend
            type: web
            runtime: docker
            rootDir: backend
            dockerfilePath: ./Dockerfile
            dockerContext: ./
            healthCheckPath: /up
            envVars:
              - key: RAILS_ENV
                value: production
              - key: RAILS_MASTER_KEY
                sync: false
              - key: DATABASE_URL
                sync: false
              - key: FRONTEND_ORIGIN
                value: https://imaiko-frontend.onrender.com

          - name: imaiko-frontend
            type: web
            runtime: static
            rootDir: frontend
            buildCommand: npm ci && npm run build
            staticPublishPath: ./dist
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: VITE_API_BASE_URL
                value: https://imaiko-backend.onrender.com
              # GA4の測定ID(公開して問題ない値)。ビルド時に埋め込まれるため、変更時は再デプロイが必要
              - key: VITE_GA_MEASUREMENT_ID
                value: G-JTBBVC8FMQ
